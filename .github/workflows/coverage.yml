name: Coverage analytics

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  analyze:

    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing must not cancel the other OS jobs.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # Tags the Codecov upload so reports can be told apart by OS.
      OS: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@main

    - name: Setup Python
      id: setup-python
      uses: actions/setup-python@main
      with:
        # "3.x" resolves to the latest stable (officially released) Python 3.
        python-version: "3.x"

    - name: Install the GUI environment (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1280x1024x24 &
        echo "DISPLAY=:99" >> $GITHUB_ENV

    - name: Generate coverage report
      run: |
        pip install pytest
        pip install pytest-cov
        pip install pytest-rerunfailures
        pip install .[opt]
        pytest --cov --cov-report=xml:coverage-${{ matrix.os }}.xml --junitxml=junit-${{ matrix.os }}.xml

    # Upload even when the tests failed, so a failing OS still reports coverage.
    - name: Upload coverage to Codecov
      if: ${{ !cancelled() }}
      env:
        # Resolved Python version (constant across OS) for the Codecov tag.
        PYTHON: ${{ steps.setup-python.outputs.python-version }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-${{ matrix.os }}.xml
        flags: os-${{ matrix.os }}
        name: coverage-${{ matrix.os }}
        env_vars: OS,PYTHON
        disable_search: true
        handle_no_reports_found: true
        fail_ci_if_error: false
        verbose: true

    # codecov/test-results-action is deprecated; use codecov-action with report_type.
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      env:
        PYTHON: ${{ steps.setup-python.outputs.python-version }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit-${{ matrix.os }}.xml
        flags: os-${{ matrix.os }}
        name: test-results-${{ matrix.os }}
        report_type: test_results
        disable_search: true
        handle_no_reports_found: true
        fail_ci_if_error: false
        verbose: true